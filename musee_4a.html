<!DOCTYPE html>
<html>
  <head>
    <script src="src/aframe.min.js"></script>
    <script src="src/aframe-ar.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Lora' rel='stylesheet'>
    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 15px;
        border-radius: 8px;
        display: none;
        z-index: 1000;
        min-width: 200px;
        font-size: 1.2em;
        max-height: 300px;
        width: 30%; 
        overflow: scroll;
      }
    </style>
  </head>
  <body style="margin:0;">
    <div id="hud"></div>
    <a-scene embedded arjs>
      <a-assets timeout="10000">
        <a-asset-item id="a_SaYa" src="https://dphilipponlfiv.github.io/techno/textures/SaYa.glb"></a-asset-item>
        <a-asset-item id="a_OlSi" src="https://dphilipponlfiv.github.io/techno/textures/OlSi.glb"></a-asset-item>
        <a-asset-item id="a_MaKi" src="https://dphilipponlfiv.github.io/techno/textures/MaKi.glb"></a-asset-item>
      </a-assets>
      <a-marker id="OlSi" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-OLSI.patt">
        <a-entity 
            gltf-model="#a_OlSi"
            position="0 -3 0"
            scale="1 1 1"
            rotation="-90 0 0">
          </a-entity>
      </a-marker>   
      <a-marker id="MaKi" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-MAKI.patt">
        <a-entity 
            gltf-model="#a_MaKi"
            position="0 70 12"
            scale="1 1 1"
            rotation="-90 0 0">
          </a-entity>
      </a-marker>   
      <a-marker id="SaYa" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-SAYA.patt">
        <a-entity 
            gltf-model="#a_SaYa"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="180 20 20">
          </a-entity>
      </a-marker>   
      <a-marker id="MaDa" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-MADA.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/MaDa.jpeg"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>   
      <a-marker id="PhLo" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-PHLO.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/PhLo.jpg"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>  
      <a-marker id="ThBa" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-THBA.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/ThBa.jpg"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>  
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      const markerInfos = {
        MaDa: {
          titre: "Le jardin de l'artiste à giverny",
          auteur: "Claude Monet",
          annee: "1900",
          lieu: "musée d'Orsay, Paris",
          description: "C'est un tableau peint par l'artiste impressioniste, Claude Monet en 1900. Elle est conservée au musée d'orsay, à Paris. Cette oeuvre dépicte un chemin passant par un jardin de fleurs violets entourés par des arbres.",
          opinion: "Claude Monet crée une ambience calme et sérène dans ces peintures en utilisant le style d'impressionisme, ce qui consiste de nombreux touches de couleurs qui rejoignent ensemble pour créer un paysage majestueux. Cette peinture en particulier nos fascine vraiment car l'artiste utilise des nuances contrastées mais parvient quand même à rendre son oeuvre harmonieux.",
          font: 'Lora',
          color: "#dac9ff",
          bg: "#5a4589"
        },
        OlSi: {
          titre: "Christ le Rédempteur",
          auteur: "Paul Landowski",
          annee: "1931",
          lieu: "Rio de Janeiro, Brésil",
          description: "Statue de Jesus Christ en haut de mont Concorvado, à Rio de Janeiro au Brésil. Construit en 1931 par Paul Landowski et conçus par le brésilien Heitor da Silva Costa.",
          opinion: "C'est beau et grand",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        PhLo: {
          titre: "Ophélie",
          auteur: "John Everett Millais",
          annee: "1851",
          lieu: "Tate Britain , à Londres",
          description: "Elle représente une personnage qui s'apelle Ophélie, qui vient de la pièce de Hamlet.",
          opinion: "On a vu plusieur fois dans la class de arts et en dehors .L'oeuvre est très belle avec toute les couleur qui va emsemble parfaitement. Meme si,la scène est tragique parce qu'elle est entrain de mourir,mais elle a une visage très calme et paisible",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        ThBa: {
          titre: "La Naissance de Vénus",
          auteur: "Sandro Botticelli",
          annee: "1485",
          lieu: "Galerie des Offices, salle 11-12 Botticelli",
          description: "Ce tableau représente Venus qui est nu est elle sur le rivage aprèes sa naissance",
          opinion: "Nous avons choisi ce tableau car cet arbre nous inspire par ses nombreux détails, et nous le trouvons magnifique avec le fond d’un bleu turquoise vif et intense qui met en évidence l’arbre fleurissant.",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        SaYa: {
          titre: "Les trois ombres",
          auteur: "Auguste Rodin",
          annee: "1889",
          lieu: "Musée de rodin -Paris",
          description: "Les trois ombres: est une piece faite pour regarder le spectateur du haut de la porte des enfers  ",
          opinion: "elle fait partie integrante de la porte des enfers alors pourquoi pas :)",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        MaKi: {
          titre: "Porco Rosso",
          auteur: "Studio Ghibli",
          annee: "1992",
          lieu: "",
          description: "Elle represente une scene du film de studio ghibli, Porco Rosso. C'est un hôtel isolé sur une petite île de la mer Adriatique, où séjourne le personnage principal, Porco Rosso, et où il rencontre Gina, la chanteuse et propriétaire de l'hôtel. ",
          opinion: "Nous aimions beaucoup cette scene car l'hotel est très belle (les plantes, la mer, l'avion, les couleurs). Et aussi parce que studio ghibli est super bien :)",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        }
        // Ajoutez d'autres marqueurs si besoin
      };
      function generateHudContent(info) {
        return `
          <div style="color:${info.color}; font-family:${info.font}; background-color:${info.bg};">
          <h2>${info.titre}</h2>
          <strong>Auteur :</strong> ${info.auteur}<br/>
          <strong>Année :</strong> ${info.annee}<br/>
          <strong>Lieu de conservation :</strong> ${info.lieu}<br/><br/>
          <strong>Description :</strong><br/>${info.description}<br/><br/>
          <strong>Opinion :</strong><br/>${info.opinion}
          </div>
        `;
      }

      // Liste des marqueurs à surveiller
      const markerIds = Object.keys(markerInfos);

      const hud = document.getElementById('hud');
      let currentVisibleMarker = null;

      markerIds.forEach(markerId => {
        const marker = document.getElementById(markerId);

        marker.addEventListener('markerFound', () => {
          // Si un autre marqueur était affiché, on ne le remplace que si c'est un nouveau
          if (currentVisibleMarker !== markerId) {
            hud.innerHTML = generateHudContent(markerInfos[markerId]);
            hud.style.display = 'block';
            currentVisibleMarker = markerId;
          }
        });

        marker.addEventListener('markerLost', () => {
          // Si le marqueur perdu est celui actuellement affiché, on masque le HUD
          if (currentVisibleMarker === markerId) {
            hud.style.display = 'none';
            currentVisibleMarker = null;
          }
        });
      });
    </script>
  </body>
</html>
