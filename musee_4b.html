<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 15px;
        border-radius: 8px;
        display: none;
        z-index: 1000;
        min-width: 200px;
        font-size: 1.2em;
        max-height: 300px;
        width: 30%; 
        overflow: scroll;
      }
    </style>
  </head>
  <body style="margin:0;">
    <div id="hud"></div>
    <a-scene embedded arjs>
      <a-assets timeout="10000">
        <a-asset-item id="a_ViEa" src="https://dphilipponlfiv.github.io/techno/textures/ViEa/ViEa.glb"></a-asset-item>
        <a-asset-item id="a_GuDu" src="https://dphilipponlfiv.github.io/techno/textures/GuDu.glb"></a-asset-item>
      </a-assets>
      <a-marker id="GuDu" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-GUDU.patt">
        <a-entity 
            gltf-model="#a_Gudu"
            position="0 0 0"
            scale="0.5 0.5 0.5"
            rotation="0 0 0">
          </a-entity>
      </a-marker>   
      <a-marker id="ArDu" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-ARDU.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/ArDu.jpg"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>   
      <a-marker id="ViEa" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-VIEA.patt">
        <a-entity 
            gltf-model="#a_ViEa"
            position="0 0 0"
            scale="0.25 0.25 0.25"
            rotation="0 0 0">
          </a-entity>
      </a-marker>   
      <a-marker id="AkFa" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-AKFA.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/AkFa.png"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>   
      <a-marker id="KaPa" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-KAPA.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/KaPa.jpeg"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>   
      <a-marker id="PhCh" type="pattern" url="https://dphilipponlfiv.github.io/techno/markers/pattern-PHCH.patt">
        <a-image src="https://dphilipponlfiv.github.io/techno/images/PhCh.webp"
                 position="0 0 0"
                 rotation="-90 0 0"
                 width="2"
                 height="2">
        </a-image>
      </a-marker>  
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      const markerInfos = {
        ArDu: {
          titre: "La grande vague de Kanagawa",
          auteur: "Katsushika Hokusai",
          annee: "1831",
          lieu: "Musée Sumida Hokusai",
          description: "Ce tableau représente une vague scélérate qui est sur le point d'abattre les deux bateaux.",
          opinion: "C'est à la fois très beau et triste. C'est beau car on peut observer la force de la nature, mais aussi percevoir les efforts, le temps et l'inspiration que le peintre a consacrés à cette œuvre. En revanche, c'est triste, car cette vague représente pour moi la violence de la nature envers les êtres humains",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        AkFa: {
          titre: "Agnus",
          auteur: "Konstantin Korobov",
          annee: "2022",
          lieu: "Musée du Prado, Madrid, Espagne",
          description: "Il représente la mort et l'enterrement",
          opinion: "C'est merveilleux.",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        KaPa: {
          titre: "Champs de tulipes en Hollande",
          auteur: "Claude Monet",
          annee: "1886",
          lieu: "musée d'Orsay",
          description: "Ce tableau represente des rangées de tulipes hollandais, le tableau est plein de couleurs vifs. On peut voir que Claude Monet utlise des touches de pinceau rapides et visibles, cela créé une perspective où les rangées de tulipes s'alignent vers l'horizon, on observe que au premier plan les détails sont plus précis,puis s'obscure progressivement cela créant une profondeur.",
          opinion: "Dans cette peinture de Claude Monet, les couleurs vifs des tulipes sont capturé et aussi selon de la vivacité,la peinture est très coloré créant une atmosphère de joie, la perspective de la peinture te fais ressentir que tu y est immergé dans les champs et dans notre opinion cette peinture nos rammène du confort.",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        ViEa: {
          titre: "democrite meditant sur le siege de l'ame",
          auteur: "Leon Alexendre Delhomme",
          annee: "1868",
          lieu: "Thrace",
          description: "il represente le philosophe grec Démocrite en train de méditer sur la localisation de l'âme.  ",
          opinion: "c'est une grande statue qui est très interresante. Democrite est aussi le troisième fils d’Hégésistrate. Il est tres detailler et majeutieuse.",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        PhCh: {
          titre: "Le Cri",
          auteur: "Edvard Munch",
          annee: "1893",
          lieu: "Musée Munch,Oslo en Norvège",
          description: "il represente la déformation du personnage et du paysage",
          opinion: "C'est très belle hehe",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        },
        GuDu: {
          titre: "Les amandiers en fleurs",
          auteur: "Van Gogh",
          annee: "1890",
          lieu: "Fondation Van Gogh,Amsterdam",
          description: "Les Amandiers en fleurs est une peinture de fleurs réalisée durant l’hiver 1890. Cette œuvre d’art a été peinte en hommage au fils de son frère, dont il est le parrain. Vincent choisit de représenter les branches d’un amandier, un arbre dont les fleurs annoncent l’arrivée du printemps. Pour réaliser cette peinture, Van Gogh s’inspira de l’art japonais de la gravure. Cette inspiration se reconnaît à la précision des lignes utilisées et au positionnement de l’arbre dans l’ensemble. Les fleurs représentées ont changé de couleur au fil des ans. Elles ont pâli sous l’effet de la lumière, ce qui leur a fait perdre leur force. Ce tableau est à présent exposé au Musée Van Gogh à Amsterdam.",
          opinion: "Nous avons choisi ce tableau car cet arbre nous inspire par ses nombreux détails, et nous le trouvons magnifique avec le fond d’un bleu turquoise vif et intense qui met en évidence l’arbre fleurissant. Ce tableau est a la fois mysterieux et émotionnel.",
          font: "arial",
          color: "#ffffff",
          bg: "#000000"
        }
        // Ajoutez d'autres marqueurs si besoin
      };
      function generateHudContent(info) {
        return `
          <div style="color:${info.color}; font-family:${info.font}; background-color:${info.bg};">
          <h2>${info.titre}</h2>
          <strong>Auteur :</strong> ${info.auteur}<br/>
          <strong>Année :</strong> ${info.annee}<br/>
          <strong>Lieu de conservation :</strong> ${info.lieu}<br/><br/>
          <strong>Description :</strong><br/>${info.description}<br/><br/>
          <strong>Opinion :</strong><br/>${info.opinion}
          </div>
        `;
      }

      // Liste des marqueurs à surveiller
      const markerIds = Object.keys(markerInfos);

      const hud = document.getElementById('hud');
      let currentVisibleMarker = null;

      markerIds.forEach(markerId => {
        const marker = document.getElementById(markerId);

        marker.addEventListener('markerFound', () => {
          // Si un autre marqueur était affiché, on ne le remplace que si c'est un nouveau
          if (currentVisibleMarker !== markerId) {
            hud.innerHTML = generateHudContent(markerInfos[markerId]);
            hud.style.display = 'block';
            currentVisibleMarker = markerId;
          }
        });

        marker.addEventListener('markerLost', () => {
          // Si le marqueur perdu est celui actuellement affiché, on masque le HUD
          if (currentVisibleMarker === markerId) {
            hud.style.display = 'none';
            currentVisibleMarker = null;
          }
        });
      });
    </script>
  </body>
</html>
